[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "paperazzi"
version = "0.1.0.dev0"
description = "Local-first Zotero-centered scholarly author knowledge base"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "Private" }
authors = [{ name = "Paperazzi" }]
dependencies = [
    "SQLAlchemy>=2.0",
    "Alembic>=1.13",
]

[project.optional-dependencies]
pdf = ["PyMuPDF>=1.24"]
web = [
    "FastAPI>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.scripts]
paperazzi-zotero-probe = "paperazzi.zotero_sqlite.probe:main"
paperazzi-web = "paperazzi.web.api:main"

[tool.setuptools]
package-dir = {"" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
