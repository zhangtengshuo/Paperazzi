name: Validate local AI audit tooling

on:
  push:
    branches: [fix/correspondence-evidence-v3-clean]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/phase5-test.txt -e ".[pdf,web]"
          python -m pip check
      - name: Compile new audit tools
        run: |
          python -m py_compile scripts/audit_full_library_local_ai.py
          python -m py_compile scripts/score_full_library_ai_review.py
      - name: Scorer smoke test
        run: |
          tmp="$(mktemp -d)"
          cat >"$tmp/audit.jsonl" <<'EOF'
          {"paper_id":1,"requires_pdf_review":true,"source_authors":["Alice Smith"],"machine_predicted_corresponding_authors":["Alice Smith"],"title":"Synthetic","selected_pdf_path":"x.pdf","flags":[]}
          EOF
          cat >"$tmp/reviews.jsonl" <<'EOF'
          {"paper_id":1,"review_status":"REVIEWED","ground_truth_correspondence_status":"EXPLICIT","ground_truth_corresponding_authors":["Alice Smith"],"primary_document_status":"OK","text_extraction_status":"OK","author_header_status":"OK","reference_section_status":"OK","issues":[],"notes":"synthetic"}
          EOF
          python scripts/score_full_library_ai_review.py --audit-jsonl "$tmp/audit.jsonl" --reviews-jsonl "$tmp/reviews.jsonl" --output "$tmp/score.json" --require-all-reviewed --fail-on-fp --min-recall 0.90
      - name: Unit and regression suite
        run: python -m unittest discover -s tests -v
      - name: Tracked 100-PDF correspondence gate
        run: python scripts/validate_correspondence_pdf_sample.py
