name: Paperazzi synthetic tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[pdf]"

      - name: Unit and regression suite
        run: python -m unittest discover -s tests -v

      - name: Validate JSON schemas parse
        run: |
          python -m json.tool schemas/phase4_report.schema.json >/dev/null
          python -m json.tool schemas/phase4_anchor_reviews.schema.json >/dev/null
